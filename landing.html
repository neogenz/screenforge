<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScreenForge — App Store screenshots, pixel-exact</title>
    <meta
      name="description"
      content="Local-first editor for iPhone App Store screenshot sets. Pixel-exact exports, every accepted dimension, one ZIP ready for App Store Connect. No account, no upload."
    />
    <meta name="theme-color" content="#111111" />
    <!-- TODO(déploiement): ajouter <link rel="canonical"> quand le domaine est
         connu. hreflang ne s'applique pas : une seule URL, la langue bascule
         côté client. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ScreenForge — App Store screenshots, pixel-exact" />
    <meta
      property="og:description"
      content="Design iPhone screenshot sets in your browser. Pixel-exact PNG-24 exports, validated for App Store Connect. Local-first: your images never leave your machine."
    />
    <meta property="og:image" content="/og-landing.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ScreenForge",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Web",
        "description": "Local-first editor for iPhone App Store screenshot sets. Pixel-exact exports, one ZIP ready for App Store Connect.",
        "offers": [
          {
            "@type": "Offer",
            "name": "Monthly",
            "price": "9.99",
            "priceCurrency": "USD",
            "description": "Unlimited exports without watermark, billed monthly."
          },
          {
            "@type": "Offer",
            "name": "Lifetime",
            "price": "39.99",
            "priceCurrency": "USD",
            "description": "One-time purchase, every future update included."
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap"
      />
    </noscript>
    <style>
      html {
        background: oklch(0.145 0 0);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
</html>
