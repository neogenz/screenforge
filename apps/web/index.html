<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScreenForge</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="/boot.js"></script>
    <style>
      /* Évite le flash du mauvais thème avant la feuille de styles. Les valeurs
         recopient les tokens de la scène et du texte secondaire : le boot doit
         être juste avant que le CSS de l'app soit disponible. */
      html {
        /* `--background`, pas `--stage` : c'est la valeur que le chrome peint
           en premier au montage, et un boot plus sombre que l'application se
           lisait comme un double flash. Les valeurs recopient la palette coss
           neutre (`index.css`) : blanc en clair, neutral-950 éclairci de 5 %
           en sombre. Le sombre est la classe, le clair son absence. */
        --boot-background: #fff;
        --boot-ink: #686868;
        --boot-track: #ebebeb;
        background: var(--boot-background);
      }
      html.dark {
        --boot-background: #161616;
        --boot-ink: #818181;
        --boot-track: #2a2a2a;
      }

      /* Le squelette de démarrage, en styles inline : la feuille de l'app fait
         partie de ce qu'on attend. Les valeurs recopient les tokens plutôt que
         de les lire, pour la même raison que la règle de fond ci-dessus. */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: var(--boot-ink);
      }
      /* Le nom de l'app est le wordmark masqué, peint dans l'encre du thème :
         il n'attend ni webfont ni CSS de l'app, et suit le basculement
         sombre/clair sans une règle de plus. */
      .boot-wordmark {
        width: 132px;
        aspect-ratio: 5900/1060;
        background: currentColor;
        -webkit-mask: url('/brand/screenforge-wordmark.svg') center / contain no-repeat;
        mask: url('/brand/screenforge-wordmark.svg') center / contain no-repeat;
      }
      .boot-bar {
        width: 96px;
        height: 2px;
        overflow: hidden;
        border-radius: 4px;
        background: var(--boot-track);
      }
      .boot-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 4px;
        background: var(--boot-ink);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      /* Le mouvement part, le signe de vie reste : sans lui l'écran de
         démarrage se lit comme une page figée. */
      @media (prefers-reduced-motion: reduce) {
        .boot-bar span {
          width: 100%;
          animation: none;
        }
      }

      /* Le chrome flottant, posé à sa géométrie finale avant tout CSS de
         l'app : la barre haute, la pellicule et le HUD de zoom montent au
         même endroit que leurs vraies vignettes, donc rien ne saute au
         montage. `lib/stage.ts` reste la source des marges et hauteurs —
         `--boot-topbar-height` vaut 46px, comme `TOP_BAR_HEIGHT` : le rang le
         plus haut de la grille de l'îlot est le champ « Nom du projet »
         (36px, coss `h-9`), pas les boutons de la barre d'outils (32px), qui
         s'y centrent verticalement ; + padding d'îlot (2×4) + filet (2×1). */
      :root {
        --boot-margin: 12px;
        --boot-topbar-height: 46px;
        --boot-topbar-radius: 18px;
        --boot-export-width: 102px;
        --boot-export-height: 32px;
        --boot-export-radius: 10px;
        --boot-filmstrip-height: 184px;
        --boot-filmstrip-width: 69px;
        --boot-hud-width: 134px;
        --boot-hud-height: 38px;
      }
      .boot-topbar {
        position: fixed;
        top: var(--boot-margin);
        left: var(--boot-margin);
        right: var(--boot-margin);
        height: var(--boot-topbar-height);
        box-sizing: border-box;
        border: 1px solid var(--boot-track);
        border-radius: var(--boot-topbar-radius);
        padding: 4px;
      }
      /* Le bouton Exporter ne se replie jamais (règle du chrome flottant) :
         sa largeur entière est partagée avec le bouton hydraté pour rester
         identique quel que soit le moteur de rendu de la police. */
      .boot-export {
        position: absolute;
        /* Le carré de positionnement absolu se compte depuis le bord interne
           du filet (la boîte de remplissage), pas depuis le bord du contenu :
           il faut donc recompter le retrait de 4px du padding en plus des 2px
           de centrage vertical (36px de rangée pour un bouton de 32px). */
        top: 6px;
        right: 4px;
        width: var(--boot-export-width);
        height: var(--boot-export-height);
        border-radius: var(--boot-export-radius);
        background: var(--boot-track);
      }
      .boot-filmstrip {
        position: fixed;
        bottom: var(--boot-margin);
        left: 50%;
        translate: -50% 0;
        width: var(--boot-filmstrip-width);
        height: var(--boot-filmstrip-height);
        border-radius: 9px;
        background: var(--boot-track);
      }
      .boot-hud {
        position: fixed;
        bottom: var(--boot-margin);
        right: var(--boot-margin);
        width: var(--boot-hud-width);
        height: var(--boot-hud-height);
        border: 1px solid var(--boot-track);
        border-radius: 18px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <!--
      Le squelette vit dans #root : React vide le conteneur au montage, il n'y a
      donc rien à retirer. Sans lui, le paquet critique — 272 ko gzip, dont
      Fabric — laissait un aplat de couleur sans nom ni signe de vie jusqu'à ce
      qu'il ait fini de s'exécuter.
    -->
    <div id="root">
      <div class="boot" role="status" aria-label="Chargement de ScreenForge">
        <span class="boot-wordmark" aria-hidden="true"></span>
        <span class="boot-bar"><span></span></span>
      </div>
      <div class="boot-topbar" aria-hidden="true">
        <span class="boot-export"></span>
      </div>
      <div class="boot-filmstrip" aria-hidden="true"></div>
      <div class="boot-hud" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
