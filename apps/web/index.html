<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScreenForge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      La feuille Inter ne bloque plus le rendu. Le navigateur la déclarait
      « blocking » : rien ne pouvait s'afficher avant un aller-retour vers une
      origine tierce. `media="print"` la sort du chemin critique, `onload` la
      rend applicable une fois arrivée. L'URL porte déjà `display=swap`, donc
      le texte s'affiche en repli puis bascule — un caractère de repli pendant
      200ms vaut mieux qu'une page vide pendant le même temps.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap"
      />
    </noscript>
    <script>
      try {
        if (localStorage.getItem('screenforge-theme') === 'light') {
          document.documentElement.classList.add('light')
        }
      } catch {}
    </script>
    <style>
      /* Évite le flash du mauvais thème avant la feuille de styles. Les valeurs
         recopient les tokens de la scène et du texte secondaire : le boot doit
         être juste avant que le CSS de l'app soit disponible. */
      html {
        --boot-background: oklch(0.145 0 0);
        --boot-ink: oklch(0.78 0 0);
        --boot-track: oklch(0.26 0 0);
        background: var(--boot-background);
      }
      html.light {
        --boot-background: oklch(0.965 0 0);
        --boot-ink: oklch(0.4 0 0);
        --boot-track: oklch(0.915 0 0);
      }

      /* Le squelette de démarrage, en styles inline : la feuille de l'app fait
         partie de ce qu'on attend. Les valeurs recopient les tokens plutôt que
         de les lire, pour la même raison que la règle de fond ci-dessus. */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.014em;
        color: var(--boot-ink);
      }
      .boot-bar {
        width: 96px;
        height: 2px;
        overflow: hidden;
        border-radius: 4px;
        background: var(--boot-track);
      }
      .boot-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 4px;
        background: var(--boot-ink);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      /* Le mouvement part, le signe de vie reste : sans lui l'écran de
         démarrage se lit comme une page figée. */
      @media (prefers-reduced-motion: reduce) {
        .boot-bar span {
          width: 100%;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!--
      Le squelette vit dans #root : React vide le conteneur au montage, il n'y a
      donc rien à retirer. Sans lui, le paquet critique — 272 ko gzip, dont
      Fabric — laissait un aplat de couleur sans nom ni signe de vie jusqu'à ce
      qu'il ait fini de s'exécuter.
    -->
    <div id="root">
      <div class="boot" role="status" aria-label="Chargement de ScreenForge">
        <span>ScreenForge</span>
        <span class="boot-bar"><span></span></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
