name: Quality

on:
  push:
  pull_request:

# Un push qui en remplace un autre sur la même branche annule le run devenu
# obsolète : sans cela la file se remplit de vérifications d'un état que
# personne ne fusionnera.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ce que la compilation seule peut dire, et le plus vite possible.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:unit
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build

  # Ce qu'il faut un vrai navigateur pour établir : le comportement e2e et les
  # deux audits qui mesurent des pixels rendus.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: supabase start
      - run: supabase migration up
      - name: Exposer le stack local à Vite et Playwright
        run: |
          status="$(supabase status -o json)"
          echo "SUPABASE_URL=$(jq -r .API_URL <<<"$status")" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(jq -r .ANON_KEY <<<"$status")" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r .SERVICE_ROLE_KEY <<<"$status")" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_URL=$(jq -r .API_URL <<<"$status")" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$(jq -r .ANON_KEY <<<"$status")" >> "$GITHUB_ENV"
      # `billingConfigured` est un booléen de compilation tiré de `VITE_API_URL`
      # (`lib/api.ts`), et sans lui l'éditeur rend la variante « sans API de
      # vente » : le bouton d'export épuisé se grise au lieu de proposer la
      # Licence. Cette variante existe, mais elle n'est pas celle qu'on livre,
      # et la CI la testait seule pendant que le poste de développement, qui a
      # son `.env`, testait l'autre. L'URL ne sert qu'à ce booléen — aucun test
      # n'appelle l'API, et la boîte des offres est entièrement côté client.
      - run: pnpm run test:e2e
        env:
          VITE_API_URL: http://127.0.0.1:8787
      - run: pnpm run audit:contrast
      - run: pnpm run audit:scale
      - run: pnpm run audit:landing
      - if: always()
        run: supabase stop --no-backup
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  # Les migrations s'appliquent sur une base vierge, à chaque commit, et les
  # policies RLS sont attaquées depuis un second compte. C'est le seul endroit
  # où un trou d'autorisation se voit : une policy manquante ne casse rien, elle
  # rend l'application plus permissive, en silence.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - run: supabase migration up
      - run: pnpm run test:rls
      # Le typage DB → client est régénéré depuis le schéma qui vient d'être
      # appliqué : s'il diffère de celui qui est committé, la compilation du web
      # tourne sur une forme de table qui n'existe plus.
      - run: pnpm run gen:types
      - run: git diff --exit-code -- apps/web/src/types/database.types.ts
      - if: always()
        run: supabase stop --no-backup

  # Le backend de vente. Aucun secret n'est nécessaire ici : `env()` est paresseux
  # et les tests posent leurs propres variables, ce qui est délibéré — un job qui
  # aurait besoin d'un jeton Polar pour compiler ne pourrait pas tourner sur une
  # pull request venue d'un fork.
  #
  # Les secrets réels (SUPABASE_SERVICE_ROLE_KEY, POLAR_ACCESS_TOKEN,
  # POLAR_WEBHOOK_SECRET) vivent dans les variables de l'hébergeur et nulle part
  # ailleurs : ni dans le dépôt, ni dans un `.env` committé, ni dans le contexte
  # d'un agent.
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api run typecheck
      - run: pnpm --filter api run test:unit

      # La clé `service_role` court-circuite la RLS : dans un paquet compilé pour
      # le navigateur, elle donnerait à n'importe quel visiteur les droits que ce
      # backend existe pour garder. Le grep échoue sur la simple mention du mot,
      # y compris dans un commentaire — la seule forme qu'une revue ne peut pas
      # oublier de faire.
      - name: Refuser service_role dans apps/web
        run: |
          if grep -rn --exclude-dir=node_modules --exclude-dir=dist \
              -e 'service_role' -e 'SERVICE_ROLE' apps/web; then
            echo "::error::La clé service_role ne doit jamais atteindre apps/web."
            exit 1
          fi
