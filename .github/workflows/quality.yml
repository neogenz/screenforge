name: Quality

on:
  push:
  pull_request:

# Un push qui en remplace un autre sur la même branche annule le run devenu
# obsolète : sans cela la file se remplit de vérifications d'un état que
# personne ne fusionnera.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ce que la compilation seule peut dire, et le plus vite possible.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:unit
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build

  # Ce qu'il faut un vrai navigateur pour établir : le comportement e2e et les
  # deux audits qui mesurent des pixels rendus.
  #
  # Aucun service n'est démarré ici. Les specs qui ont besoin d'un compte
  # vérifient `localConvex()` et se sautent d'elles-mêmes en son absence — c'est
  # la même règle qu'avant, appliquée à un déploiement plutôt qu'à Docker, et
  # elle vaut que le reste de la suite tourne sans rien à provisionner.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # `billingConfigured` est un booléen de compilation tiré de
      # `VITE_COMMERCIAL_LAUNCH` (`lib/commercial-launch.ts`). La suite
      # principale pose la variable et prouve les paliers lancés ; son second
      # serveur la force vide et prouve séparément le ZIP propre illimité de la
      # variante pré-lancement.
      - run: pnpm run test:e2e
      - run: pnpm run audit:contrast
      - run: pnpm run audit:scale
      - run: pnpm run audit:landing
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  # Le déploiement : schéma, autorisation, vente et suppression de compte.
  #
  # Aucun secret n'est nécessaire — les tests posent leurs propres variables, ce
  # qui est délibéré : un job qui aurait besoin d'un jeton Polar pour compiler ne
  # pourrait pas tourner sur une pull request venue d'un fork. Les jetons réels
  # (`POLAR_ACCESS_TOKEN`, `POLAR_WEBHOOK_SECRET`, `AUTH_*`) vivent dans les
  # variables du déploiement Convex et nulle part ailleurs : ni dans le dépôt, ni
  # dans un `.env` committé, ni dans le contexte d'un agent.
  #
  # Aucun grep ne garde `apps/web` contre une clé privilégiée qui y aurait
  # fuité, et c'est délibéré : il n'existe pas de clé qui contourne
  # l'autorisation, parce qu'il n'existe pas de chemin vers les données à côté
  # des fonctions.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend run typecheck
      - run: pnpm --filter backend run test:unit
